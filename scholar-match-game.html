<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학자-이론-키워드 연결 게임</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #657186;
      --line: #d9e0ea;
      --paper: #f7f9fc;
      --panel: rgba(255, 255, 255, 0.9);
      --brand: #0c7a7a;
      --brand-dark: #075f61;
      --rose: #c94d67;
      --gold: #b67505;
      --blue: #2864b8;
      --green: #14744e;
      --shadow: 0 18px 45px rgba(22, 34, 50, 0.12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      overflow-x: hidden;
    }

    #studyMap {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(130deg, rgba(12, 122, 122, 0.16), rgba(40, 100, 184, 0.08) 48%, rgba(201, 77, 103, 0.1)),
        #f5f8fb;
    }

    .shell {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 22px 0 18px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin: 0 auto 10px;
      padding: 6px 10px;
      border: 1px solid rgba(12, 122, 122, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--brand-dark);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(31px, 5vw, 58px);
      line-height: 1.03;
      letter-spacing: 0;
      text-align: center;
    }

    .lead {
      max-width: 720px;
      margin: 14px auto 0;
      color: #435064;
      font-size: 17px;
      line-height: 1.7;
      text-align: center;
      word-break: keep-all;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      margin-top: 2px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(22, 34, 50, 0.08);
    }

    .status-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      margin: 12px 0 18px;
    }

    .stat {
      min-height: 78px;
      padding: 13px 14px;
      border: 1px solid rgba(217, 224, 234, 0.9);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(22, 34, 50, 0.07);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 25px;
      line-height: 1;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid rgba(217, 224, 234, 0.9);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .segmented {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: var(--radius);
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    button:focus-visible {
      outline: 3px solid rgba(12, 122, 122, 0.35);
      outline-offset: 2px;
    }

    .chip {
      padding: 0 13px;
      border: 1px solid var(--line);
      background: #fff;
      color: #374458;
    }

    .chip.active {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .primary, .secondary, .ghost {
      padding: 0 15px;
    }

    .primary {
      background: var(--ink);
      color: #fff;
    }

    .secondary {
      border: 1px solid rgba(12, 122, 122, 0.35);
      background: #e8f4f2;
      color: var(--brand-dark);
    }

    .ghost {
      border: 1px solid var(--line);
      background: #fff;
      color: #384559;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.5; transform: none; }

    .game {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .lane {
      border: 1px solid rgba(217, 224, 234, 0.94);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .lane h2 {
      margin: 0;
      padding: 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 249, 252, 0.88);
      font-size: 16px;
    }

    .cards {
      display: grid;
      gap: 9px;
      padding: 12px;
    }

    .match-card {
      min-height: 70px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-left: 5px solid transparent;
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      text-align: left;
      line-height: 1.45;
      box-shadow: 0 5px 16px rgba(22, 34, 50, 0.06);
      word-break: keep-all;
    }

    .match-card small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .match-card[data-lane="scholar"],
    .match-card[data-lane="theory"] {
      text-align: center;
    }

    .match-card.selected {
      border-color: var(--blue);
      border-left-color: var(--blue);
      background: #edf5ff;
    }

    .match-card.locked {
      border-color: rgba(20, 116, 78, 0.35);
      border-left-color: var(--green);
      background: #effaf3;
      color: #183b2d;
    }

    .match-card.wrong {
      border-color: rgba(201, 77, 103, 0.45);
      border-left-color: var(--rose);
      background: #fff0f3;
      animation: shake 0.24s ease;
    }

    @keyframes shake {
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }

    .feedback {
      min-height: 98px;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid rgba(217, 224, 234, 0.95);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    .feedback strong {
      display: block;
      margin-bottom: 7px;
      font-size: 18px;
    }

    .feedback p {
      margin: 0;
      color: #405067;
      line-height: 1.7;
      word-break: keep-all;
    }

    .progress {
      height: 10px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #e1e7ef;
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--brand), var(--gold));
      transition: width 0.25s ease;
    }

    .review {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .review-card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.84);
      line-height: 1.55;
    }

    .review-card b {
      display: block;
      margin-bottom: 4px;
    }

    .review-card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 900px) {
      header, .toolbar { grid-template-columns: 1fr; }
      .home-link, .actions { justify-self: start; }
      .status-board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .game, .review { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .shell { width: min(100% - 20px, 1200px); padding-top: 12px; }
      .status-board { grid-template-columns: 1fr; }
      .toolbar { padding: 10px; }
      .segmented, .actions { width: 100%; }
      .chip, .primary, .secondary, .ghost { flex: 1 1 auto; }
      .match-card { min-height: 62px; }
    }
  </style>
</head>
<body>
  <canvas id="studyMap" aria-hidden="true"></canvas>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">청소년상담사 3급 Part 3</p>
        <h1>학자-이론-키워드 연결 게임</h1>
        <p class="lead">청소년상담사 3급 기출 정리 자료와 기존 게임 자료의 주요 학자 73명을 바탕으로 학자명, 대표 이론, 핵심 키워드를 한 묶음으로 연결합니다.</p>
      </div>
      <a class="home-link" href="./index.html">← 이전화면</a>
    </header>

    <section class="status-board" aria-label="게임 현황">
      <div class="stat"><span>라운드</span><strong id="roundStat">1/5</strong></div>
    </section>

    <section class="toolbar" aria-label="게임 설정">
      <div class="segmented" role="group" aria-label="문항 수">
        <button class="chip active" data-size="6">빠른 6묶음</button>
        <button class="chip" data-size="10">표준 10묶음</button>
        <button class="chip" data-size="73">전체 73묶음</button>
      </div>
      <div class="actions">
        <button class="ghost" id="nextBtn" disabled>다음문제</button>
        <button class="primary" id="newBtn">새 게임</button>
      </div>
    </section>

    <main class="game" aria-label="연결 게임판">
      <section class="lane">
        <h2>학자</h2>
        <div class="cards" id="scholarLane"></div>
      </section>
      <section class="lane">
        <h2>대표 이론</h2>
        <div class="cards" id="theoryLane"></div>
      </section>
      <section class="lane">
        <h2>키워드</h2>
        <div class="cards" id="keywordLane"></div>
      </section>
    </main>

    <section class="feedback" aria-live="polite">
      <strong id="feedbackTitle">세 장을 골라 한 묶음을 완성하세요.</strong>
      <p id="feedbackText">학자, 대표 이론, 키워드 카드가 모두 같은 학자에게 연결되면 자동으로 잠깁니다.</p>
      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    </section>

    <section class="review" id="reviewList" aria-label="완성한 연결 목록"></section>
  </div>
  <script>
    const scholars = [
      {
        "id": "baltes",
        "scholar": "발테스",
        "english": "P. Baltes",
        "theory": "성공적 노화 이론 (보상을 수반한 선택적 최적화 모델 / SOC 모델)",
        "keywords": "선택(Selection), 최적화(Optimization), 보상(Compensation)",
        "note": "발테스은(는) 성공적 노화 이론 (보상을 수반한 선택적 최적화 모델 / SOC 모델)와 관련해 선택(Selection), 최적화(Optimization), 보상(Compensation)를 중심으로 기억하세요."
      },
      {
        "id": "piaget",
        "scholar": "피아제",
        "english": "J. Piaget",
        "theory": "인지발달 단계 이론",
        "keywords": "대상영속성, 자아중심성(세 산 모형), 동화·조절·평형화",
        "note": "피아제은(는) 인지발달 단계 이론와 관련해 대상영속성, 자아중심성(세 산 모형), 동화·조절·평형화를 중심으로 기억하세요."
      },
      {
        "id": "vygotsky",
        "scholar": "비고츠키",
        "english": "L. Vygotsky",
        "theory": "사회문화적 인지발달 이론",
        "keywords": "근접발달영역(ZPD), 비계설정(Scaffolding), 사적 언어/혼잣말",
        "note": "비고츠키은(는) 사회문화적 인지발달 이론와 관련해 근접발달영역(ZPD), 비계설정(Scaffolding), 사적 언어/혼잣말를 중심으로 기억하세요."
      },
      {
        "id": "lenneberg",
        "scholar": "레느버그",
        "english": "E. Lenneberg",
        "theory": "언어생득설",
        "keywords": "언어획득장치(LAD), 결정적 시기, 생득적 기제",
        "note": "레느버그은(는) 언어생득설와 관련해 언어획득장치(LAD), 결정적 시기, 생득적 기제를 중심으로 기억하세요."
      },
      {
        "id": "bowlby",
        "scholar": "볼비",
        "english": "J. Bowlby",
        "theory": "애착 이론",
        "keywords": "애착 형성 단계, 내적 작동 모델, 생존 본능 행동",
        "note": "볼비은(는) 애착 이론와 관련해 애착 형성 단계, 내적 작동 모델, 생존 본능 행동를 중심으로 기억하세요."
      },
      {
        "id": "ainsworth",
        "scholar": "에인스워스",
        "english": "M. Ainsworth",
        "theory": "낯선 상황 실험 및 애착 유형 분류",
        "keywords": "안정 애착, 회피 애착, 저항(불안정-저항) 애착",
        "note": "에인스워스은(는) 낯선 상황 실험 및 애착 유형 분류와 관련해 안정 애착, 회피 애착, 저항(불안정-저항) 애착를 중심으로 기억하세요."
      },
      {
        "id": "harlow",
        "scholar": "할로우",
        "english": "H. Harlow",
        "theory": "원숭이 대리모 실험",
        "keywords": "접촉 위안(Contact Comfort), 헝겊 어미, 신체적 접촉",
        "note": "할로우은(는) 원숭이 대리모 실험와 관련해 접촉 위안(Contact Comfort), 헝겊 어미, 신체적 접촉를 중심으로 기억하세요."
      },
      {
        "id": "erikson",
        "scholar": "에릭슨",
        "english": "E. Erikson",
        "theory": "심리사회적 발달 8단계 이론",
        "keywords": "자율성 vs 수치심, 근면성 vs 열등감, 정체감 vs 역할 혼미",
        "note": "에릭슨은(는) 심리사회적 발달 8단계 이론와 관련해 자율성 vs 수치심, 근면성 vs 열등감, 정체감 vs 역할 혼미를 중심으로 기억하세요."
      },
      {
        "id": "marcia",
        "scholar": "마샤",
        "english": "J. Marcia",
        "theory": "정체감 지위 이론",
        "keywords": "위기(Crisis), 전념(Commitment), 4대 지위(성취·유예·유실·혼미)",
        "note": "마샤은(는) 정체감 지위 이론와 관련해 위기(Crisis), 전념(Commitment), 4대 지위(성취·유예·유실·혼미)를 중심으로 기억하세요."
      },
      {
        "id": "kohlberg",
        "scholar": "콜버그",
        "english": "L. Kohlberg",
        "theory": "도덕성 발달 3수준 6단계 이론",
        "keywords": "전인습(벌/복종), 인습(착한 아이/법), 후인습(사회계약/보편윤리)",
        "note": "콜버그은(는) 도덕성 발달 3수준 6단계 이론와 관련해 전인습(벌/복종), 인습(착한 아이/법), 후인습(사회계약/보편윤리)를 중심으로 기억하세요."
      },
      {
        "id": "corey",
        "scholar": "코리",
        "english": "G. Corey",
        "theory": "집단 발달 단계 모델",
        "keywords": "초기 단계, 과도기 단계(저항/갈등), 작업 단계(깊은 개방)",
        "note": "코리은(는) 집단 발달 단계 모델와 관련해 초기 단계, 과도기 단계(저항/갈등), 작업 단계(깊은 개방)를 중심으로 기억하세요."
      },
      {
        "id": "yalom",
        "scholar": "얄롬",
        "english": "I. Yalom",
        "theory": "집단 치료적 요인",
        "keywords": "보평성, 이타주의, 집단 응집성",
        "note": "얄롬은(는) 집단 치료적 요인와 관련해 보평성, 이타주의, 집단 응집성를 중심으로 기억하세요."
      },
      {
        "id": "wubbolding",
        "scholar": "우볼딩",
        "english": "R. Wubbolding",
        "theory": "현실치료 WDEP 상담 절차 모델",
        "keywords": "Wants(바람), Doing(현재행동), Evaluation(자기평가)",
        "note": "우볼딩은(는) 현실치료 WDEP 상담 절차 모델와 관련해 Wants(바람), Doing(현재행동), Evaluation(자기평가)를 중심으로 기억하세요."
      },
      {
        "id": "moreno",
        "scholar": "모레노",
        "english": "J. L. Moreno",
        "theory": "심리극 (Psychodrama)",
        "keywords": "이중자아(Double), 거울(Mirroring), 역할 전환(Role Reversal)",
        "note": "모레노은(는) 심리극 (Psychodrama)와 관련해 이중자아(Double), 거울(Mirroring), 역할 전환(Role Reversal)를 중심으로 기억하세요."
      },
      {
        "id": "spearman",
        "scholar": "스피어만",
        "english": "C. Spearman",
        "theory": "지능 2요인설",
        "keywords": "일반요인($g$요인), 특수요인($s$요인), 공통적 지적 능력",
        "note": "스피어만은(는) 지능 2요인설와 관련해 일반요인($g$요인), 특수요인($s$요인), 공통적 지적 능력를 중심으로 기억하세요."
      },
      {
        "id": "cattell_horn",
        "scholar": "카텔 & 혼",

    const state = {
      size: 6,
      deck: [],
      queue: [],
      selected: { scholar: null, theory: null, keyword: null },
      matched: new Set(),
      attempts: 0,
      correct: 0,
      streak: 0,
      round: 0,
      totalRounds: 5,
      roundComplete: false
    };

    const els = {
      scholarLane: document.getElementById("scholarLane"),
      theoryLane: document.getElementById("theoryLane"),
      keywordLane: document.getElementById("keywordLane"),
      roundStat: document.getElementById("roundStat"),
      feedbackTitle: document.getElementById("feedbackTitle"),
      feedbackText: document.getElementById("feedbackText"),
      progressBar: document.getElementById("progressBar"),
      reviewList: document.getElementById("reviewList"),
      nextBtn: document.getElementById("nextBtn"),
      newBtn: document.getElementById("newBtn")
    };

    function shuffle(items) {
      const mixed = [...items];
      for (let i = mixed.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [mixed[i], mixed[j]] = [mixed[j], mixed[i]];
      }
      return mixed;
    }

    function drawDeck(size) {
      return state.queue.splice(0, Math.min(size, state.queue.length));
    }

    function cardButton(item, lane) {
      const button = document.createElement("button");
      button.className = "match-card";
      button.dataset.id = item.id;
      button.dataset.lane = lane;
      button.type = "button";

      if (lane === "scholar") {
        button.innerHTML = `${item.scholar}<small>${item.english}</small>`;
      } else if (lane === "theory") {
        button.textContent = item.theory;
      } else {
        button.textContent = item.keywords;
      }

      button.addEventListener("click", () => selectCard(button, item, lane));
      return button;
    }

    function render() {
      els.scholarLane.replaceChildren(...shuffle(state.deck).map(item => cardButton(item, "scholar")));
      els.theoryLane.replaceChildren(...shuffle(state.deck).map(item => cardButton(item, "theory")));
      els.keywordLane.replaceChildren(...shuffle(state.deck).map(item => cardButton(item, "keyword")));
      state.selected = { scholar: null, theory: null, keyword: null };
      paintLocked();
      updateStats();
      renderReview();
    }

    function selectCard(button, item, lane) {
      if (state.matched.has(item.id)) return;
      document.querySelectorAll(`.match-card[data-lane="${lane}"]`).forEach(card => card.classList.remove("selected", "wrong"));
      button.classList.add("selected");
      state.selected[lane] = item;
      const picked = Object.values(state.selected).filter(Boolean);
      if (picked.length === 3) checkMatch();
    }

    function checkMatch() {
      const ids = Object.values(state.selected).map(item => item.id);
      const isCorrect = ids.every(id => id === ids[0]);
      state.attempts += 1;

      if (isCorrect) {
        const item = state.selected.scholar;
        state.correct += 1;
        state.streak += 1;
        state.matched.add(item.id);
        setFeedback("정답입니다.", `${item.scholar} - ${item.theory} - ${item.keywords}`);
      } else {
        state.streak = 0;
        markWrong();
        const anchor = state.selected.scholar || state.selected.theory || state.selected.keyword;
        setFeedback("아직 연결이 맞지 않습니다.", anchor ? `${anchor.scholar}의 단서는 "${anchor.theory}"입니다.` : "한 번 더 조합해 보세요.");
      }

      state.selected = { scholar: null, theory: null, keyword: null };
      setTimeout(() => {
        document.querySelectorAll(".match-card").forEach(card => card.classList.remove("selected", "wrong"));
        paintLocked();
        updateStats();
        renderReview();
        if (state.matched.size === state.deck.length) completeRound();
      }, 450);
    }

    function markWrong() {
      Object.values(state.selected).filter(Boolean).forEach(item => {
        document.querySelectorAll(`.match-card[data-id="${item.id}"]`).forEach(card => {
          if (card.classList.contains("selected")) card.classList.add("wrong");
        });
      });
    }

    function paintLocked() {
      document.querySelectorAll(".match-card").forEach(card => {
        const locked = state.matched.has(card.dataset.id);
        card.classList.toggle("locked", locked);
        card.disabled = locked;
      });
    }

    function updateStats() {
      els.roundStat.textContent = `${state.round}/${state.totalRounds}`;
      els.progressBar.style.width = `${(state.matched.size / state.deck.length) * 100}%`;
    }

    function setFeedback(title, text) {
      els.feedbackTitle.textContent = title;
      els.feedbackText.textContent = text;
    }

    function renderReview() {
      const matched = state.deck.filter(item => state.matched.has(item.id));
      els.reviewList.replaceChildren(...matched.map(item => {
        const article = document.createElement("article");
        article.className = "review-card";
        article.innerHTML = `<b>${item.scholar}</b><span>${item.theory}</span><span>${item.keywords}</span>`;
        return article;
      }));
    }

    function completeRound() {
      const accuracy = state.attempts ? Math.round((state.correct / state.attempts) * 100) : 0;
      state.roundComplete = true;
      els.nextBtn.disabled = false;
      if (state.queue.length) {
        setFeedback("라운드 완료", `정답률 ${accuracy}%입니다. 다음문제를 누르면 아직 출제되지 않은 학자들로 새 그룹이 나옵니다.`);
      } else {
        setFeedback(`${scholars.length}명 완료`, `정답률 ${accuracy}%입니다. 다음문제를 누르면 전체 학자를 다시 섞어 새 세트를 시작합니다.`);
      }
    }

    function startSet(size = state.size) {
      state.size = size;
      state.queue = shuffle(scholars);
      state.round = 0;
      state.totalRounds = Math.ceil(scholars.length / size);
      nextGroup();
    }

    function nextGroup() {
      if (!state.roundComplete && state.round > 0) return;
      if (!state.queue.length) {
        state.queue = shuffle(scholars);
        state.round = 0;
      }
      state.deck = drawDeck(state.size);
      state.selected = { scholar: null, theory: null, keyword: null };
      state.matched = new Set();
      state.attempts = 0;
      state.correct = 0;
      state.streak = 0;
      state.round += 1;
      state.roundComplete = false;
      els.nextBtn.disabled = true;
      els.newBtn.textContent = "새 게임";
      setFeedback("세 장을 골라 한 묶음을 완성하세요.", "학자, 대표 이론, 키워드 카드가 모두 같은 학자에게 연결되면 자동으로 잠깁니다.");
      render();
    }

    document.querySelectorAll("[data-size]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-size]").forEach(chip => chip.classList.remove("active"));
        button.classList.add("active");
        startSet(Number(button.dataset.size));
      });
    });

    els.nextBtn.addEventListener("click", nextGroup);
    els.newBtn.addEventListener("click", () => startSet(state.size));

    const canvas = document.getElementById("studyMap");
    const ctx = canvas.getContext("2d");
    let nodes = [];

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      nodes = Array.from({ length: Math.min(54, Math.floor(window.innerWidth / 18)) }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.24,
        vy: (Math.random() - 0.5) * 0.24,
        r: Math.random() * 2 + 1.5
      }));
    }

    function animateMap() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      nodes.forEach(node => {
        node.x += node.vx;
        node.y += node.vy;
        if (node.x < 0 || node.x > window.innerWidth) node.vx *= -1;
        if (node.y < 0 || node.y > window.innerHeight) node.vy *= -1;
      });

      for (let i = 0; i < nodes.length; i += 1) {
        for (let j = i + 1; j < nodes.length; j += 1) {
          const a = nodes[i];
          const b = nodes[j];
          const distance = Math.hypot(a.x - b.x, a.y - b.y);
          if (distance < 155) {
            ctx.strokeStyle = `rgba(12, 122, 122, ${0.13 * (1 - distance / 155)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      nodes.forEach(node => {
        ctx.fillStyle = "rgba(40, 100, 184, 0.22)";
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animateMap);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    animateMap();
    startSet(6);
  </script>
</body>
</html>
